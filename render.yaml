services:
  - type: web
    name: the-shelf
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_DURATION
        value: 24h
      - key: MONGODB_URI
        sync: false
      - key: APP_BASE_URL
        sync: false
