# =============================================================================
# The Shelf — DevSecOps Security Pipeline
# Runs SAST, SCA, and DAST on every push and pull request
# =============================================================================

name: Security Pipeline (SAST + SCA + DAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Stage 0: Unit Tests — Security Regression Checks
  # Verifies password validation, JWT integrity, and path traversal prevention
  # Refs #16
  # ===========================================================================
  unit-tests:
    name: "Unit Tests — Security Regression Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security unit tests
        run: npm test

  # ===========================================================================
  # Stage 1: SCA — Software Composition Analysis
  # Scans dependencies for known CVEs using npm audit
  # Refs #3
  # ===========================================================================
  sca:
    name: "SCA — Dependency Vulnerability Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (JSON report)
        run: npm audit --json > sca-npm-audit.json || true

      - name: Run npm audit (readable output)
        run: npm audit --omit=dev 2>&1 | tee sca-npm-audit-readable.txt || true

      - name: Check for critical/high vulnerabilities (quality gate)
        run: |
          echo "=== SCA Quality Gate ==="
          # Fail the pipeline if critical or high vulnerabilities are found
          CRITICAL=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL"
          echo "High: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::SCA FAILED — Found $CRITICAL critical and $HIGH high severity vulnerabilities"
            exit 1
          fi
          echo "SCA passed — no critical or high vulnerabilities found"

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-npm-audit.json
            sca-npm-audit-readable.txt

  # ===========================================================================
  # Stage 2: SAST — Static Application Security Testing
  # Scans source code for security flaws using Semgrep
  # Refs #4
  # ===========================================================================
  sast:
    name: "SAST — Static Code Analysis (Semgrep)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (JSON report)
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/jwt \
            --config p/xss \
            --config p/javascript \
            --config p/typescript \
            --json \
            --output sast-semgrep-report.json \
            . || true

      - name: Run Semgrep (readable text report)
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/jwt \
            --config p/xss \
            --config p/javascript \
            --config p/typescript \
            --text \
            --output sast-semgrep-readable.txt \
            . || true

      - name: Check for critical SAST findings (quality gate)
        run: |
          echo "=== SAST Quality Gate ==="
          if [ -f sast-semgrep-report.json ]; then
            ERRORS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' sast-semgrep-report.json 2>/dev/null || echo "0")
            WARNINGS=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' sast-semgrep-report.json 2>/dev/null || echo "0")
            echo "Errors (high severity): $ERRORS"
            echo "Warnings (medium severity): $WARNINGS"
            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::SAST FAILED — Found $ERRORS high-severity findings"
              exit 1
            fi
            echo "SAST passed — no high-severity findings"
          else
            echo "No Semgrep report found — skipping quality gate"
          fi

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            sast-semgrep-report.json
            sast-semgrep-readable.txt

  # ===========================================================================
  # Stage 3: DAST — Dynamic Application Security Testing
  # Builds and runs the Dockerised app, then scans with OWASP ZAP
  # Refs #5
  # ===========================================================================
  dast:
    name: "DAST — Dynamic Scan (OWASP ZAP, Dockerised)"
    runs-on: ubuntu-latest
    # DAST runs independently — SCA/SAST findings should not block dynamic testing
    # All three stages run in parallel to demonstrate full pipeline coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create empty certs dir so Docker volume mount succeeds
      # The server skips HTTPS when no cert is present — HTTP on 3000 is enough for DAST
      - name: Prepare certs directory
        run: mkdir -p certs

      # Write a .env file that docker compose reads for variable substitution
      - name: Create CI environment file
        run: |
          cat > .env << 'ENVEOF'
          JWT_SECRET=ci-pipeline-test-secret-not-for-production
          SESSION_DURATION=24h
          ENVEOF

      # Build the multi-stage Docker image and start the full stack
      # --wait blocks until the app healthcheck passes (up to 120 s)
      - name: Build and start Dockerised application
        run: |
          docker compose up -d --build --wait app mongo
        timeout-minutes: 10

      # Belt-and-suspenders: confirm the API is reachable from the runner
      - name: Verify app is reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/books > /dev/null; then
              echo "App is ready on http://localhost:3000"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 2
          done
          curl -f http://localhost:3000/api/books || \
            (echo "::error::App failed to start" && docker compose logs app && exit 1)

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a -j"
          allow_issue_writing: false
        continue-on-error: true

      # Parse ZAP's JSON report and surface finding counts as a quality gate
      - name: DAST quality gate — report finding counts
        if: always()
        run: |
          echo "=== DAST Quality Gate ==="
          if [ -f report_json.json ]; then
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' report_json.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' report_json.json 2>/dev/null || echo "0")
            echo "High risk:   $HIGH"
            echo "Medium risk: $MEDIUM"
            echo "Low risk:    $LOW"
            if [ "$HIGH" -gt 0 ]; then
              echo "::warning::DAST found $HIGH HIGH risk finding(s) — review DAST report artifact"
            fi
            echo "Full findings are in the dast-report artifact"
          else
            echo "No DAST report found — ZAP may have failed to start"
          fi

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes
