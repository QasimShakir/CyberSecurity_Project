version: "3.9"

services:
  # --------------------------------------------------------------------------
  # The Shelf — Node.js application
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shelf-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-random-secret}
      SESSION_DURATION: ${SESSION_DURATION:-24h}
    volumes:
      - epub-storage:/app/storage/epub
      - cover-storage:/app/storage/covers
      - ./certs:/app/certs:ro

  # --------------------------------------------------------------------------
  # HTTPS certificate generator — runs once to create self-signed cert
  # Used for demo/viva requirement: "Demo to be on HTTPS"
  # --------------------------------------------------------------------------
  certgen:
    image: alpine/openssl
    container_name: shelf-certgen
    volumes:
      - ./certs:/certs
    entrypoint: >
      sh -c '
        if [ ! -f /certs/server.key ]; then
          openssl req -x509 -nodes -days 365
            -newkey rsa:2048
            -keyout /certs/server.key
            -out /certs/server.cert
            -subj "/C=PK/ST=Sindh/L=Karachi/O=TheShelf/CN=localhost";
          echo "Self-signed certificate generated.";
        else
          echo "Certificate already exists, skipping.";
        fi
      '

volumes:
  epub-storage:
    driver: local
  cover-storage:
    driver: local